# ─────────────────────────────────────────────────────────────────────
# Контент-план. Один файл — всё расписание публикаций.
# Скопируй в content/plan.yaml и правь под себя:
#   cp content/plan.example.yaml content/plan.yaml
#
# Проверить: npm run publish:check
# Вхолостую: npm run publish:run -- --dry-run
# ─────────────────────────────────────────────────────────────────────

# Часовой пояс, в котором записано время ниже.
timezone: Europe/Moscow

# Значения по умолчанию для всех постов (каждый пост может их переопределить).
defaults:
  platforms: [instagram, vk]
  tags: [ландшафтныйдизайн, благоустройство]

posts:
  # ── Вертикальный ролик (reel / клип) ──────────────────────────────
  - id: 2026-09-23-terrace-reel # уникальное имя, менять нельзя: по нему
    when: 2026-09-23 10:00 #     система помнит, что уже опубликовано
    type: reel
    media:
      - media/terrace.mp4 # путь внутри папки content/
    cover: media/terrace-cover.jpg # обложка (необязательно)
    text: |
      Терраса у воды: собрали за три недели.

      Рассказываем, почему настил из лиственницы,
      и во сколько это обошлось.

  # ── Пост с одной фотографией ──────────────────────────────────────
  - id: 2026-09-24-before-after
    when: 2026-09-24 12:30
    type: photo
    media:
      - media/before-after.jpg
    text: |
      Было — стало. Участок 12 соток, работа заняла сезон.
    tags: [доипосле, сад] # свои хештеги вместо тех, что в defaults

  # ── Карусель (2–10 файлов) ────────────────────────────────────────
  - id: 2026-09-26-carousel
    when: 2026-09-26 18:00
    type: carousel
    media:
      - media/step-1.jpg
      - media/step-2.jpg
      - media/step-3.jpg
    text: |
      Три шага проектирования участка — коротко о главном.
    # Текст можно развести по площадкам: в ВК уместен длинный,
    # в Instagram — короткий.
    overrides:
      vk:
        text: |
          Три шага проектирования участка.

          1. Обмеры и анализ: рельеф, вода, стороны света.
          2. Зонирование: где дом дышит, а где живёт сад.
          3. Рабочая документация: по ней строят.

          Записаться на консультацию — в сообщениях сообщества.
        tags: [ландшафтныйдизайн, проектирование]

  # ── Пост только в одну площадку ───────────────────────────────────
  - id: 2026-09-28-vk-only
    when: 2026-09-28 09:00
    type: photo
    platforms: [vk]
    media:
      - media/portfolio.jpg
    text: |
      Открыли запись на проектирование на следующий сезон.
